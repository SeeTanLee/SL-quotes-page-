        :root {
            /* EASY STYLE CUSTOMIZATION */
            --font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            --active-background: #f5f5f5;
            --quote-color: #2c2c2c;
            --category-color: #666;
            --source-color: #888;
            --refresh-color: #888;
            --card-max-width: 680px;
            --card-min-height: 180px;
            --card-padding: clamp(1.25rem, 5vw, 2rem);
            --quote-size: clamp(1.05rem, 3.6vw, 1.3rem);
            --source-size: clamp(0.78rem, 2.5vw, 0.88rem);
            --category-size: clamp(0.7rem, 2.2vw, 0.78rem);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-width: 0;
            height: 100%;
            min-height: var(--card-min-height);
            background: var(--background);
        }

        body {
            overflow: hidden;
            font-family: var(--font-family);
        }

        .card-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: var(--card-min-height);
            padding: var(--card-padding);
            overflow: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s ease;
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .card-container::after {
            content: "↻";
            position: absolute;
            top: max(0.85rem, env(safe-area-inset-top));
            right: max(1rem, env(safe-area-inset-right));
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: var(--refresh-color);
            pointer-events: none;
        }

        .card-container:hover::after,
        .card-container:focus-visible::after {
            opacity: 0.55;
        }

        .card-container:active {
            background: var(--active-background);
        }

        .card-content {
            width: 100%;
            max-width: var(--card-max-width);
            margin: 0 auto;
            text-align: left;
            position: relative;
        }

        .main-text,
        .categories,
        .source {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.6s ease forwards;
        }

        .main-text {
            font-size: var(--quote-size);
            font-weight: 400;
            font-style: italic;
            margin: 0 0 0.85rem;
            color: var(--quote-color);
            letter-spacing: 0.005em;
            line-height: 1.45;
            text-wrap: pretty;
            overflow-wrap: anywhere;
        }

        .categories {
            color: var(--category-color);
            font-size: var(--category-size);
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.08em;
            line-height: 1.4;
            text-transform: uppercase;
            animation-delay: 0.1s;
        }

        .source {
            color: var(--source-color);
            font-size: var(--source-size);
            font-weight: 400;
            margin: 0.75rem 0 0;
            letter-spacing: 0.01em;
            line-height: 1.4;
            animation-delay: 0.2s;
        }

        .source a {
            color: inherit;
            text-decoration: none;
        }

        .source a:hover,
        .source a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 0.18em;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 420px) {
            :root {
                --card-padding: 1.15rem;
            }

            .card-container::after {
                opacity: 0.25;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card-container,
            .card-container::after {
                transition: none;
            }

            .main-text,
            .categories,
            .source {
                opacity: 1;
                transform: none;
                animation: none;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Change these values to keep the widget light in Notion dark mode. */
                --background: #191919;
                --active-background: #222;
                --quote-color: #f1f1ef;
                --category-color: #b7b7b3;
                --source-color: #9b9b97;
                --refresh-color: #aaa;
            }
        }

        let currentQuoteIndex = -1;

        function getEnabledQuotes() {
            if (!Array.isArray(SETTINGS.enabledCategories) || SETTINGS.enabledCategories.length === 0) {
                return quotes;
            }

            const enabled = new Set(SETTINGS.enabledCategories.map(category => category.toLowerCase()));
            const filtered = quotes.filter(item =>
                item.categories.some(category => enabled.has(category.toLowerCase()))
            );

            return filtered.length > 0 ? filtered : quotes;
        }

        function getLocalDateKey(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function hashString(value) {
            let hash = 2166136261;
            for (let index = 0; index < value.length; index += 1) {
                hash ^= value.charCodeAt(index);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function getDailyIndex(pool) {
            const dateKey = getLocalDateKey();
            return hashString(dateKey) % pool.length;
        }

        function getRandomIndex(pool) {
            if (pool.length <= 1) {
                return 0;
            }

            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * pool.length);
            } while (nextIndex === currentQuoteIndex);

            return nextIndex;
        }

        function renderQuote(index) {
            const pool = getEnabledQuotes();
            const item = pool[index];
            currentQuoteIndex = index;

            const container = document.getElementById("card-content");
            container.replaceChildren();

            const quote = document.createElement("p");
            quote.className = "main-text";
            quote.textContent = `“${item.quote}”`;

            container.appendChild(quote);

            if (SETTINGS.showCategories) {
                const categories = document.createElement("p");
                categories.className = "categories";
                categories.textContent = item.categories.join(" · ");
                container.appendChild(categories);
            }

            const source = document.createElement("p");
            source.className = "source";
            const attribution = SETTINGS.showSourceTitle && item.sourceTitle
                ? `${item.speaker} — ${item.field} · ${item.sourceTitle}`
                : `${item.speaker} — ${item.field}`;

            if (SETTINGS.linkAttributionToReference) {
                const link = document.createElement("a");
                link.href = item.reference;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = attribution;
                link.setAttribute("aria-label", `${attribution}. Open quotation source.`);
                source.appendChild(link);
            } else {
                source.textContent = attribution;
            }

            container.appendChild(source);
        }

        function showInitialQuote() {
            const pool = getEnabledQuotes();
            const mode = String(SETTINGS.rotationMode).toLowerCase();
            const index = mode === "random" ? getRandomIndex(pool) : getDailyIndex(pool);
            renderQuote(index);
        }

        function showRandomQuote() {
            const pool = getEnabledQuotes();
            renderQuote(getRandomIndex(pool));
        }

        const card = document.getElementById("quote-card");

        card.addEventListener("click", event => {
            if (!SETTINGS.allowManualRefresh) {
                return;
            }

            // Let an enabled attribution link work normally.
            if (event.target.closest("a")) {
                return;
            }

            showRandomQuote();
        });

        card.addEventListener("keydown", event => {
            if (!SETTINGS.allowManualRefresh) {
                return;
            }

            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                showRandomQuote();
            }
        });

        showInitialQuote();

        if (Number(SETTINGS.autoRotateSeconds) > 0) {
            window.setInterval(
                showRandomQuote,
                Number(SETTINGS.autoRotateSeconds) * 1000
            );
        }
    </script>
